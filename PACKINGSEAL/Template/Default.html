<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8" />
    <style>
        /* Ép layout mặc định, không theo theme */
        html, body {
            margin: 0;
            padding: 0;
            background-color: #ffffff !important;
            color: #000000 !important;
            font-family: Arial, sans-serif;
        }
        /* Ngăn hệ thống ép High Contrast */
        @media (prefers-color-scheme: dark) {
            html, body {
                background-color: #ffffff !important;
                color: #000000 !important;
            }
        }
    </style>
</head>
<body>
</body>
</html>
